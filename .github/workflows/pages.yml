name: Deploy Unitex website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build pages and static assets
        run: |
          mkdir -p _site
          cat site-parts/part-*.txt > "$RUNNER_TEMP/unitex-source.html"
          base64 --decode og-image.webp.b64 > _site/og-image.webp
          cat > "$RUNNER_TEMP/build-pages.cjs" <<'UNITEX_BUILD'
          const { createHash } = require('node:crypto');
          const { mkdirSync, readFileSync, writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          const { Script } = require('node:vm');

          const [sourcePath, output] = process.argv.slice(2);
          const source = readFileSync(sourcePath, 'utf8');
          const siteURL = 'https://cz007.github.io/unitex-website/';
          const extensions = {
            'image/webp': 'webp',
            'image/jpeg': 'jpg',
            'image/png': 'png',
            'font/woff2': 'woff2',
            'font/ttf': 'ttf',
          };
          const base85 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!#$%&()*+-;:=>?@^_\x60{|}~';
          const base91 = Array.from({ length: 94 }, (_, i) => String.fromCharCode(33 + i))
            .filter(character => !['"', '\\', '<'].includes(character)).join('');
          const digits85 = new Map([...base85].map((character, i) => [character, i]));
          const digits91 = new Map([...base91].map((character, i) => [character, i]));

          function decodeBase85(encoded) {
            const bytes = Buffer.alloc(Math.floor(encoded.length * 4 / 5));
            for (let input = 0, output = 0; input < encoded.length; output += 4) {
              let word = 0;
              for (let digit = 0; digit < 5; digit++, input++) {
                word = word * 85 + (input < encoded.length ? digits85.get(encoded[input]) : 84);
              }
              if (!Number.isFinite(word)) throw new Error('Invalid Base85 digit');
              for (let byte = 0; byte < 4 && output + byte < bytes.length; byte++) {
                bytes[output + byte] = word >>> (24 - 8 * byte);
              }
            }
            return bytes;
          }

          function decodeBase91(encoded) {
            const bytes = Buffer.alloc(Math.ceil(encoded.length * 7 / 8));
            let output = 0;
            let buffer = 0;
            let bits = 0;
            for (let input = 0; input < encoded.length; input += 2) {
              const first = digits91.get(encoded[input]);
              if (first === undefined) throw new Error('Invalid Base91 digit');
              if (input + 1 === encoded.length) {
                bytes[output++] = buffer | (first << bits);
                break;
              }
              const second = digits91.get(encoded[input + 1]);
              if (second === undefined) throw new Error('Invalid Base91 digit');
              const pair = first + 91 * second;
              buffer |= pair << bits;
              bits += (pair & 8191) > 88 ? 13 : 14;
              while (bits >= 8) {
                bytes[output++] = buffer;
                buffer >>>= 8;
                bits -= 8;
              }
            }
            return bytes.subarray(0, output);
          }

          function replaceOne(input, before, after) {
            const first = input.indexOf(before);
            if (first === -1 || input.indexOf(before, first + before.length) !== -1) {
              throw new Error('Expected one match for ' + before.slice(0, 80));
            }
            return input.slice(0, first) + after + input.slice(first + before.length);
          }

          const packedResources = source.match(/<script type="application\/json" id="unitex-offline-resources">([^<]+)<\/script>/);
          if (!packedResources) throw new Error('Missing source asset bundle');
          const assetDirectory = join(output, 'assets');
          mkdirSync(assetDirectory, { recursive: true });
          const assets = JSON.parse(packedResources[1]).map((resource, id) => {
            if (resource === null) return null;
            const match = /^data:([^;,]+);(base91|base85|base64),([\s\S]+)$/.exec(resource);
            if (!match || !extensions[match[1]]) throw new Error('Unsupported asset format at ' + id);
            const [, type, encoding, payload] = match;
            const bytes = encoding === 'base91' ? decodeBase91(payload)
              : encoding === 'base85' ? decodeBase85(payload) : Buffer.from(payload, 'base64');
            const hash = createHash('sha256').update(bytes).digest('hex').slice(0, 16);
            const filename = id + '-' + hash + '.' + extensions[type];
            writeFileSync(join(assetDirectory, filename), bytes);
            return './assets/' + filename;
          });

          let page = replaceOne(source, packedResources[0],
            '<script type="application/json" id="unitex-offline-assets">' + JSON.stringify(assets) + '</script>');
          page = replaceOne(page,
            "const resources = read('unitex-offline-resources');\n  const urls = [];",
            "const assets = read('unitex-offline-assets');");

          // Retain the embedded factory HTML, but resolve its media to the published files.
          const base91Start = page.indexOf('  // Base91 holds the original image bytes');
          const packedFactoriesStart = page.indexOf('  const packedFactories =', base91Start);
          const hydrateStart = page.indexOf('  function hydrate(content) {', packedFactoriesStart);
          const hydrateEnd = page.indexOf('  function sameFileURL(', hydrateStart);
          if (base91Start < 0 || packedFactoriesStart < 0 || hydrateStart < 0 || hydrateEnd < 0) {
            throw new Error('Missing source hydration boundaries');
          }
          page = page.slice(0, base91Start) + page.slice(packedFactoriesStart, hydrateStart) +
            '  function hydrate(content) {\n' +
            '    return content.replace(assetPattern, (_, id) => new URL(assets[id], location.href).href);\n' +
            '  }\n\n' + page.slice(hydrateEnd);
          page = replaceOne(page, '    hydrateMain,\n', '');
          page = replaceOne(page, 'window.UnitexOffline.hydrateMain();', '');
          page = page.replaceAll('<style data-unitex-assets type="text/plain">', '<style>');
          page = page.replace(/(\s)data-unitex-src="(__UNITEX_ASSET_\d+__)"/g, '$1src="$2"');
          page = page.replace(/__UNITEX_ASSET_(\d+)__/g, (_, id) => {
            if (!assets[id]) throw new Error('Missing asset ' + id);
            return assets[id];
          });

          const homeTitle = 'Unitex | Apparel Development &amp; Global Manufacturing';
          function withMetadata(html, filename, title, description) {
            const newTitle = '<title>' + title + '</title>';
            html = replaceOne(html, '<title>' + homeTitle + '</title>', newTitle);
            html = html.replace(/<meta name="description" content="[^"]*">/, '');
            const url = siteURL + filename;
            const preview = siteURL + 'og-image.webp';
            return replaceOne(html, newTitle, [
              newTitle,
              '<meta name="description" content="' + description + '">',
              '<link rel="canonical" href="' + url + '">',
              '<meta property="og:type" content="website">',
              '<meta property="og:site_name" content="UNITEX">',
              '<meta property="og:title" content="' + title + '">',
              '<meta property="og:description" content="' + description + '">',
              '<meta property="og:url" content="' + url + '">',
              '<meta property="og:image" content="' + preview + '">',
              '<meta property="og:image:secure_url" content="' + preview + '">',
              '<meta property="og:image:type" content="image/webp">',
              '<meta property="og:image:width" content="1536">',
              '<meta property="og:image:height" content="1024">',
              '<meta property="og:image:alt" content="Unitex apparel manufacturing">',
              '<meta name="twitter:card" content="summary_large_image">',
              '<meta name="twitter:title" content="' + title + '">',
              '<meta name="twitter:description" content="' + description + '">',
              '<meta name="twitter:image" content="' + preview + '">',
            ].join('\n'));
          }

          const mainRoute = "const mainSection = () => here().hash.startsWith('#factory/') ? '#home' : here().hash;";
          const qualityRoute = "const mainSection = () => location.pathname.endsWith('/quality.html') && !here().hash ? '#quality-view' : here().hash.startsWith('#factory/') ? '#home' : here().hash;";
          const pages = {
            'unitex.html': withMetadata(page, 'unitex.html', homeTitle,
              'Apparel development and manufacturing across China, Cambodia, Vietnam, Myanmar and Kenya.'),
            'quality.html': withMetadata(replaceOne(page, mainRoute, qualityRoute), 'quality.html',
              'Quality | Unitex Apparel Development &amp; Global Manufacturing',
              'Quality through every production stage, from incoming materials to final inspection and release.'),
          };
          for (const [filename, html] of Object.entries(pages)) {
            for (const [, attributes, script] of html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)) {
              if (!attributes.includes('type="application/json"')) new Script(script, { filename });
            }
            writeFileSync(join(output, filename), html);
            console.log(filename + ' ' + Buffer.byteLength(html) + ' bytes');
          }
          console.log(assets.filter(Boolean).length + ' static assets');
          UNITEX_BUILD
          node "$RUNNER_TEMP/build-pages.cjs" "$RUNNER_TEMP/unitex-source.html" _site
          cat > _site/index.html <<'UNITEX_REDIRECT'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="0;url=unitex.html"><link rel="canonical" href="unitex.html">
          <title>Unitex</title><script>location.replace('unitex.html'+location.search+location.hash);</script></head>
          <body><a href="unitex.html">Unitex company website</a></body></html>
          UNITEX_REDIRECT
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
