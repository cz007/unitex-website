name: Deploy Unitex website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble site pages
        run: |
          mkdir -p _site
          cat site-parts/part-*.txt > _site/index.html
          python3 - <<'PY'
          from pathlib import Path
          source = Path("_site/index.html")
          html = source.read_text(encoding="utf-8")
          needle = "const mainSection = () => here().hash.startsWith('#factory/') ? '#home' : here().hash;"
          replacement = "const mainSection = () => location.pathname.endsWith('/quality.html') && !here().hash ? '#quality-view' : here().hash.startsWith('#factory/') ? '#home' : here().hash;"
          if html.count(needle) != 1 or 'id="quality-view"' not in html:
              raise SystemExit("Expected Unitex quality view routing was not found exactly once")
          Path("_site/quality.html").write_text(html.replace(needle, replacement), encoding="utf-8")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
